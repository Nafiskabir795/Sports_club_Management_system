<!-- Page element explained below. -->
<!DOCTYPE html>
<!-- Page element explained below. -->
<html lang="en">
 <!-- Page element explained below. -->
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
  <title>
   Admin Login - Sports Club
  </title>
  <!-- Page element explained below. -->
  <link href="style.css" rel="stylesheet"/>
 </head>
 <!-- Page element explained below. -->
 <body>
  <!-- Page element explained below. -->
  <main class="auth-page">
   <!-- Page element explained below. -->
   <section class="auth-card">
    <!-- Page element explained below. -->
    <a class="back-link" href="index.html">
     &larr; Back to Home
    </a>
    <span class="badge">
     ADMIN / COACH PORTAL
    </span>
    <!-- Page element explained below. -->
    <h1>
     Admin Sign In
    </h1>
    <!-- Page element explained below. -->
    <p class="muted">
     Authorized coaches use this portal to manage the club.
    </p>
    <!-- Page element explained below. -->
    <form id="adminLoginForm">
     <label for="admin_identifier">
      Admin ID, Email or Phone
     </label>
     <!-- Page element explained below. -->
     <input autocomplete="username" id="admin_identifier" required="" type="text"/>
     <label for="admin_password">
      Password
     </label>
     <!-- Page element explained below. -->
     <input autocomplete="current-password" id="admin_password" required="" type="password"/>
     <!-- Page element explained below. -->
     <button class="btn primary full" type="submit">
      Sign In as Admin
     </button>
     <!-- Page element explained below. -->
     <div class="message hidden" id="adminLoginMessage">
     </div>
    </form>
    <!-- Page element explained below. -->
    <p class="auth-switch">
     New coach/admin?
     <!-- Page element explained below. -->
     <a href="admin_register.html">
      Register an admin account &rarr;
     </a>
    </p>
   </section>
  </main>
  <!-- Page element explained below. -->
  <script src="theme.js">
  </script>
  <!-- Page element explained below. -->
  <script src="app.js">
  </script>
  <!-- Page element explained below. -->
  <script>
   document.addEventListener('DOMContentLoaded',initAdminLogin);
  </script>
 </body>
</html>
